name: Tafsiri CI

on:
  push:
    branches: [main, staging, 'chore/**']
  pull_request:
    branches: [main, staging, 'feature/tafsiri-migration-011-lexical-core', 'feature/tafsiri-luwanga-lexical-pilot-001', 'feature/tafsiri-complete-platform-architecture', 'feature/tafsiri-data-studio', 'feature/tafsiri-partner-rc-001']

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci
        working-directory: apps/reviewer-portal
      - run: python tests/studio/prepare_local.py
      - run: python tests/studio/staging_manifest.py
      - run: npx supabase start --workdir .studio-local > /tmp/studio-start.log 2>&1
      - run: npx playwright install --with-deps chromium
        working-directory: apps/reviewer-portal
      - run: python tests/studio/database_checks.py
      - run: npx playwright test --config playwright.studio.config.ts
        working-directory: apps/reviewer-portal
      - run: python tests/studio/backup_restore.py
      - run: node scripts/studio-storage-restore.mjs
        working-directory: apps/reviewer-portal
      - run: npx playwright test --config playwright.studio-reviewer.config.ts
        working-directory: apps/reviewer-portal
      - if: always()
        run: npx supabase stop --workdir .studio-local --no-backup
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/reviewer-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/reviewer-portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest tests -q

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset --local
      - name: Run database smoke tests
        shell: bash
        run: |
          docker exec -i supabase_db_project-tafsiri psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/database/portal_implementation_002_smoke.sql
          docker exec -i supabase_db_project-tafsiri psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/database/source_provenance_foundation_smoke.sql
          docker exec -i supabase_db_project-tafsiri psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/database/linguistic_evidence_foundation_smoke.sql
          docker exec -i supabase_db_project-tafsiri psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/database/scholarly_book_source_type_smoke.sql
          docker exec -i supabase_db_project-tafsiri psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/database/canonical_linguistic_rule_governance_smoke.sql
          docker exec -i supabase_db_project-tafsiri psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/database/source_artifact_foundation_smoke.sql
          docker exec -i supabase_db_project-tafsiri psql -U postgres -d postgres -v ON_ERROR_STOP=1 < tests/database/canonical_lexical_core_smoke.sql
      - name: Rehearse lexical migration failure, compatibility, and concurrent writes
        shell: bash
        run: |
          lexical_image=$(docker inspect --format '{{.Config.Image}}' supabase_db_project-tafsiri)
          docker run -d --name tafsiri-m011-validation-db -e POSTGRES_PASSWORD=tafsiri-local-fixture-only "$lexical_image"
          for attempt in {1..60}; do
            if docker exec tafsiri-m011-validation-db pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          python tests/database/run_lexical_core_replay_tests.py
          python tests/database/run_lexical_core_concurrency_tests.py
      - name: Test atomic Marlo registration
        run: python tests/database/run_marlo_registration_atomic_tests.py
      - name: Validate governed lexical promotion in a disposable database
        shell: bash
        run: |
          promotion_image=$(docker inspect --format '{{.Config.Image}}' supabase_db_project-tafsiri)
          docker run -d --name tafsiri-m012-validation-db -e POSTGRES_PASSWORD=tafsiri-local-fixture-only "$promotion_image"
          for attempt in {1..60}; do
            if docker exec tafsiri-m012-validation-db pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          python tests/database/run_lexical_promotion_tests.py
      - name: Validate multilingual registry and pipeline foundation
        shell: bash
        run: |
          registry_image=$(docker inspect --format '{{.Config.Image}}' supabase_db_project-tafsiri)
          docker run -d --name tafsiri-m013-validation-db -e POSTGRES_PASSWORD=tafsiri-local-fixture-only "$registry_image"
          python tests/database/run_multilingual_foundation_tests.py
      - run: npx supabase db lint --local --level error
      - if: always()
        run: docker rm -f tafsiri-m011-validation-db || true
      - if: always()
        run: docker rm -f tafsiri-m012-validation-db || true
      - if: always()
        run: docker rm -f tafsiri-m013-validation-db || true
      - if: always()
        run: npx supabase stop --no-backup
